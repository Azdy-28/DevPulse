name: Keep Render backend warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:  

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -sf https://devpulse-api.onrender.com/api/health \
            || echo "Ping failed — Render may be mid-redeploy, not necessarily down"